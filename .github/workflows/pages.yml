name: GameVault · ZIP 首次导入、自动测试与 GitHub Pages 发布

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Expand uploaded ZIP into Git source tree (first run only)
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package.json && -d frontend ]]; then
            echo "GameVault source tree already exists; skipping one-time extraction."
          else
            ARCHIVE="GameVault-v2.5.0-full-project.zip"
            test -s "$ARCHIVE"
            if [[ -f "${ARCHIVE}.sha256" ]]; then
              sha256sum -c "${ARCHIVE}.sha256"
            fi
            unzip -tq "$ARCHIVE"

            SOURCE_DIR="${RUNNER_TEMP}/gamevault-source"
            mkdir -p "$SOURCE_DIR"
            unzip -q "$ARCHIVE" -d "$SOURCE_DIR"
            test -f "${SOURCE_DIR}/package.json"
            test -f "${SOURCE_DIR}/frontend/index.html"
            test -f "${SOURCE_DIR}/backend/server.js"

            # Keep this bootstrap workflow instead of replacing it with the
            # older workflow bundled inside the source archive.
            cp .github/workflows/pages.yml "${RUNNER_TEMP}/pages.yml"
            cp -a "${SOURCE_DIR}/." .
            cp "${RUNNER_TEMP}/pages.yml" .github/workflows/pages.yml

            # Remove the incomplete temporary base64 upload from the earlier attempt.
            rm -rf GameVault-upload
            sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            if git diff --cached --quiet; then
              echo "No source-tree changes to commit."
            else
              git commit -m "chore: expand GameVault v2.5.0 source tree"
              git push origin "HEAD:${GITHUB_REF_NAME}"
            fi
          fi

          test -f package.json
          test -f frontend/index.html
          test -f backend/server.js

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run automated tests
        run: npm test

      - name: Verify release files and references
        run: npm run verify:release

      - name: Package complete source tree
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          ARCHIVE_NAME="GameVault-v${VERSION}-full-project.zip"
          ARCHIVE_PATH="${RUNNER_TEMP}/${ARCHIVE_NAME}"
          zip -r -q "${ARCHIVE_PATH}" . \
            -x ".git/*" "*/.git/*" \
               "node_modules/*" "*/node_modules/*" \
               "backend/data/*.json" \
               "*.zip" "*.sha256"
          sha256sum "${ARCHIVE_PATH}" > "${ARCHIVE_PATH}.sha256"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "archive_path=${ARCHIVE_PATH}" >> "${GITHUB_OUTPUT}"
          echo "checksum_path=${ARCHIVE_PATH}.sha256" >> "${GITHUB_OUTPUT}"

      - name: Upload complete project ZIP
        uses: actions/upload-artifact@v4
        with:
          name: GameVault-v${{ steps.package.outputs.version }}-full-project
          path: |
            ${{ steps.package.outputs.archive_path }}
            ${{ steps.package.outputs.checksum_path }}
          if-no-files-found: error
          retention-days: 90

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static frontend to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
